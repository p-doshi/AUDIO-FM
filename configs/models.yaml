# Kickoff model set for Phase 1. Names must match a @register_model(...)
# name in audio_comp/models/. See each adapter module's docstring for the
# HF id, paradigm, and license behind each entry.
#
# `beats` is registered (so the framework already models it) but left out
# of the active run below — needs custom loader integration beyond a
# config entry; see its adapter module's docstring for the remaining work.
# `audio_jepa` was in the same boat until 2026-08-09, when its loader got
# wired up against the model's own author-provided inference_example.py.

active_models:
  - clap
  - mert
  - hubert
  - wav2vec2
  - music2vec
  - musicfm
  - audio_jepa

deferred_models:
  - beats
